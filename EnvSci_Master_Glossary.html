<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#1B3A6B;--sky:#2E8BC0;--teal:#1D9E75;--amber:#E59400;--red:#E74C3C;--purple:#8B5CF6;
  --bg:#060e1a;--card:#0a1929;--card2:#0d1e32;--border:#1e3a5c;
  --text:#e8edf4;--muted:#6b8ab0;--white:#ffffff;
  --accent:#1D9E75;--accent-soft:rgba(29,158,117,.12);--accent-text:#4fd1a5;
}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);line-height:1.5;font-size:15px;min-height:100vh}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:linear-gradient(rgba(46,139,192,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(46,139,192,0.04) 1px,transparent 1px);
  background-size:44px 44px}
.app{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:26px 20px 70px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--accent-text);text-decoration:none;margin-bottom:14px;opacity:.9}
.header{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.series-label{font-family:'DM Mono',monospace;font-size:11px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin-bottom:6px}
.page-title{font-size:2.1rem;font-weight:800;color:var(--white);line-height:1.1}
.page-title span{color:var(--accent-text)}
.page-sub{font-size:13px;color:var(--muted);margin-top:6px}
.about-banner{background:linear-gradient(135deg,var(--accent-soft),rgba(29,158,117,.05));border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:18px;font-size:12.5px;line-height:1.55}
.about-banner a{color:var(--accent-text)}
.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat-chip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:104px;flex:1}
.stat-num{font-size:20px;font-weight:800;color:var(--white);font-family:'DM Mono',monospace}
.stat-lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-top:2px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px}
.sec-lbl{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.13em;color:var(--muted);margin-bottom:11px;text-transform:uppercase}
.controls{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;flex-direction:column;gap:11px}
.ctrl-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.ctrl-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.12em;color:var(--muted);min-width:56px}
.search-input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:13.5px}
.search-input:focus{outline:none;border-color:var(--accent)}
.pill{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:6px 13px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .18s}
.pill:hover{border-color:var(--accent);color:var(--text)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{border:none;border-radius:11px;padding:11px 20px;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;cursor:pointer;transition:all .2s;color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-accent{background:var(--accent)}
.btn-accent:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 22px rgba(0,0,0,.35)}
.btn-ghost{background:var(--bg);border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent)}
.btn-teal{background:#188663}
.tag{font-size:9.5px;font-weight:700;letter-spacing:.05em;padding:3px 9px;border-radius:6px;display:inline-block}
.t-unit{background:var(--accent-soft);color:var(--accent-text);border:1px solid var(--border)}
.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}
.footer{margin-top:36px;padding-top:16px;border-top:1px solid var(--border);font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);text-align:center;line-height:1.7}
.overlay{position:fixed;inset:0;background:rgba(3,8,16,.82);backdrop-filter:blur(4px);z-index:500;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.overlay.open{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:24px;max-width:640px;width:100%}
.opt{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 15px;cursor:pointer;transition:all .16s;display:flex;align-items:flex-start;gap:11px;text-align:left;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--text);width:100%}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--card2)}
.opt:disabled{cursor:default}
.opt-key{width:24px;height:24px;border-radius:7px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;font-family:'DM Mono',monospace;flex-shrink:0;color:var(--muted)}
.opt.correct{border-color:var(--teal);background:rgba(29,158,117,.11)}
.opt.correct .opt-key{background:#188663;border-color:var(--teal);color:#fff}
.opt.wrong{border-color:var(--red);background:rgba(231,76,60,.10)}
.opt.wrong .opt-key{background:#D24536;border-color:var(--red);color:#fff}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media(max-width:640px){.page-title{font-size:1.55rem}.ctrl-label{min-width:auto}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}


.alpha{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:14px}
.alpha a{font-family:'DM Mono',monospace;font-size:11.5px;color:var(--muted);text-decoration:none;padding:4px 7px;border-radius:6px;border:1px solid transparent}
.alpha a:hover{border-color:var(--border);color:#fff}
.alpha a.off{opacity:.25;pointer-events:none}
.letter{font-family:'DM Mono',monospace;font-size:13px;color:var(--accent-text);margin:20px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.term{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:9px}
.term-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.term-name{font-size:15.5px;font-weight:800;color:var(--white)}
.term-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.t-du{background:rgba(229,148,0,.12);color:#efb44e;border:1px solid rgba(229,148,0,.3)}
.term-def{font-size:13.5px;line-height:1.6;margin-top:8px}
.term-ex{font-size:12.5px;color:#a9c2dc;margin-top:7px;padding-left:10px;border-left:2px solid var(--accent)}
.star{background:none;border:none;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;padding:2px}
.star.on{color:#efb44e}
.tutor-toggle{margin-top:9px;background:none;border:none;color:var(--accent-text);font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;padding:0}
.tutor{display:none;margin-top:10px;border-top:1px solid var(--border);padding-top:10px}
.tutor.open{display:block}
.chat{display:flex;flex-direction:column;gap:7px;max-height:240px;overflow-y:auto;margin-bottom:8px}
.bub{font-size:13px;line-height:1.6}
.bub.u{background:var(--accent-soft);padding:8px 11px;border-radius:9px;border-left:2px solid var(--accent)}
.bub code{font-family:'DM Mono',monospace;font-size:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chip{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:11.5px;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
.chip:hover{border-color:var(--accent);color:#fff}
.trow{display:flex;gap:7px}
.tin{flex:1;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:8px 11px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:12.5px}
.tmode{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:6px}
.fc{perspective:900px;margin:16px 0}
.fc-inner{position:relative;min-height:210px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.fc-back{transform:rotateY(180deg);font-size:14px;line-height:1.6}
.fc-term{font-size:24px;font-weight:800;color:#fff}
.fc-hint{font-size:11px;color:var(--muted);margin-top:10px;font-family:'DM Mono',monospace}
.q-def{font-size:15px;color:#fff;font-weight:600;line-height:1.55;margin:14px 0 16px;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.mtop{display:flex;justify-content:space-between;align-items:center;font-family:'DM Mono',monospace;font-size:11.5px;color:var(--muted)}
.fb{margin-top:12px;font-size:13px;line-height:1.55;display:none}
.fb.show{display:block}

</style>

<script>
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function nl(s){ return esc(s).replace(/\n/g,'<br>'); }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function game(){ return window.StudyHubGame || {answer(){},event(){}}; }

const UNIT_NAMES = {"U1": "Intro to Env Science & Inquiry", "U2": "Earth Systems & Ecology", "U3": "Biodiversity & Populations", "U4": "Biomes, Wetlands & Aquatic Systems", "U5": "Conservation & Wildlife Management", "U6": "Soil, Agriculture & Food", "U7": "Water Resources", "U8": "Energy Resources", "U9": "Global Change & Environmental Health", "U10": "Air, Land & Waste"};
const DOMAINS = {"D1": {"name": "Ecological Principles", "weight": 20, "icon": "🌿"}, "D2": {"name": "Species Identification", "weight": 10, "icon": "🦆"}, "D3": {"name": "Wildlife Conservation & Management", "weight": 30, "icon": "🪶"}, "D4": {"name": "Habitat Conservation & Management", "weight": 40, "icon": "🌾"}};
const TERMS = [
{
"t": "Environmental Science",
"u": "U1",
"d": "The interdisciplinary study of how humans interact with the natural world — drawing on biology, chemistry, geology, economics, and policy.",
"ex": "Studying how fertilizer runoff from farms affects Lake Okeechobee combines chemistry, ecology, and agricultural policy."
},
{
"t": "Sustainability",
"u": "U1",
"d": "Meeting the needs of people today without reducing the ability of future generations to meet their own needs.",
"ex": "Harvesting fish no faster than the population can replace itself."
},
{
"t": "Ecological Footprint",
"u": "U1",
"d": "The area of land and water needed to supply the resources a person or population uses and absorb the waste it produces.",
"ex": "The average U.S. footprint is several times larger than the global average."
},
{
"t": "Tragedy of the Commons",
"u": "U1",
"d": "When individuals acting in their own short-term interest overuse a shared resource until it is degraded for everyone.",
"ex": "Overfishing in open ocean waters that no single nation controls."
},
{
"t": "Natural Resource",
"u": "U1",
"d": "Any material or energy from the environment that humans use — air, water, soil, minerals, wildlife, fuels."
},
{
"t": "Renewable Resource",
"u": "U1",
"d": "A resource that is replenished by natural processes on a human timescale, if it is not overused.",
"ex": "Sunlight, wind, forests, fresh water."
},
{
"t": "Nonrenewable Resource",
"u": "U1",
"d": "A resource that forms far more slowly than we use it, so supplies are effectively finite.",
"ex": "Coal, oil, natural gas, and uranium."
},
{
"t": "Hypothesis",
"u": "U1",
"d": "A testable, falsifiable explanation or prediction, often written in if/then form.",
"ex": "If nitrate levels increase, then algae growth in the pond will increase."
},
{
"t": "Independent Variable",
"u": "U1",
"d": "The factor the investigator deliberately changes in an experiment.",
"ex": "The amount of fertilizer added to each test plot."
},
{
"t": "Dependent Variable",
"u": "U1",
"d": "The factor that is measured to see how it responds to the independent variable.",
"ex": "The amount of algae that grows in each tank."
},
{
"t": "Control Group",
"u": "U1",
"d": "The group that does not receive the experimental treatment; it gives a baseline for comparison."
},
{
"t": "Correlation",
"u": "U1",
"d": "A pattern in which two variables change together. A correlation alone does not prove that one causes the other.",
"ex": "Ice cream sales and drownings both rise in summer — heat drives both."
},
{
"t": "Peer Review",
"u": "U1",
"d": "Evaluation of a scientific study by independent experts before it is published, to check its methods and conclusions."
},
{
"t": "Precautionary Principle",
"u": "U1",
"d": "When an action may cause serious harm, take protective measures even before the cause-and-effect relationship is fully proven."
},
{
"t": "Environmental Justice",
"u": "U1",
"d": "The fair treatment of all people in environmental decisions, so no group bears a disproportionate share of pollution or is excluded from decisions."
},
{
"t": "Ecosystem",
"u": "U2",
"d": "All the organisms in an area plus the nonliving environment they interact with.",
"ex": "A cypress dome: cypress trees, frogs, wading birds, water, soil, and sunlight.",
"du": "D1"
},
{
"t": "Biotic Factor",
"u": "U2",
"d": "A living or once-living part of an ecosystem.",
"ex": "Plants, animals, fungi, bacteria, fallen leaves.",
"du": "D1"
},
{
"t": "Abiotic Factor",
"u": "U2",
"d": "A nonliving physical or chemical part of an ecosystem.",
"ex": "Temperature, sunlight, water depth, salinity, soil pH.",
"du": "D1"
},
{
"t": "Producer (Autotroph)",
"u": "U2",
"d": "An organism that makes its own food, usually by photosynthesis, forming the base of the food chain.",
"ex": "Pondweed, algae, and wild rice in a marsh.",
"du": "D1"
},
{
"t": "Consumer (Heterotroph)",
"u": "U2",
"d": "An organism that gets energy by eating other organisms. Primary consumers eat producers; secondary and tertiary consumers eat other consumers.",
"du": "D1"
},
{
"t": "Decomposer",
"u": "U2",
"d": "An organism, mostly bacteria and fungi, that breaks down dead material and returns nutrients to the soil and water.",
"du": "D1"
},
{
"t": "Detritivore",
"u": "U2",
"d": "An animal that feeds on dead organic matter (detritus).",
"ex": "Earthworms, crayfish, and many aquatic insect larvae.",
"du": "D1"
},
{
"t": "Trophic Level",
"u": "U2",
"d": "An organism's feeding position in a food chain — producer, primary consumer, secondary consumer, and so on.",
"du": "D1"
},
{
"t": "Food Web",
"u": "U2",
"d": "The network of interconnected food chains in an ecosystem, showing that most organisms eat and are eaten by several others.",
"du": "D1"
},
{
"t": "10% Rule",
"u": "U2",
"d": "On average only about 10% of the energy at one trophic level is passed to the next; the rest is lost mostly as heat from respiration.",
"ex": "10,000 kcal of plants supports about 1,000 kcal of herbivores and about 100 kcal of predators.",
"du": "D1"
},
{
"t": "Biomass",
"u": "U2",
"d": "The total mass of living organic matter in an area or trophic level.",
"du": "D1"
},
{
"t": "Net Primary Productivity (NPP)",
"u": "U2",
"d": "The rate at which producers store energy as biomass after subtracting the energy they use for their own respiration.",
"ex": "Wetlands and estuaries have some of the highest NPP on Earth.",
"du": "D1"
},
{
"t": "Photosynthesis",
"u": "U2",
"d": "The process producers use to convert light energy, CO₂, and water into glucose and oxygen.",
"ex": "6CO₂ + 6H₂O + light → C₆H₁₂O₆ + 6O₂"
},
{
"t": "Cellular Respiration",
"u": "U2",
"d": "The process organisms use to release energy from glucose, producing CO₂ and water."
},
{
"t": "Biogeochemical Cycle",
"u": "U2",
"d": "The movement of a chemical element (carbon, nitrogen, phosphorus, water) through living things and the nonliving environment.",
"du": "D1"
},
{
"t": "Carbon Cycle",
"u": "U2",
"d": "The movement of carbon among the atmosphere, oceans, organisms, soil, and rock through photosynthesis, respiration, decomposition, and combustion.",
"du": "D1"
},
{
"t": "Nitrogen Fixation",
"u": "U2",
"d": "Conversion of unusable nitrogen gas (N₂) into ammonia or nitrate that plants can absorb, done by certain bacteria and by lightning.",
"ex": "Bacteria in the root nodules of legumes such as clover and soybeans.",
"du": "D1"
},
{
"t": "Denitrification",
"u": "U2",
"d": "Conversion of nitrates back into N₂ gas by bacteria in low-oxygen soils. Wetlands are major sites of denitrification, which removes excess nitrogen from water.",
"du": "D1"
},
{
"t": "Phosphorus Cycle",
"u": "U2",
"d": "The slow cycling of phosphorus between rock, soil, water, and organisms. It has no significant atmospheric phase, so phosphorus is often a limiting nutrient.",
"du": "D1"
},
{
"t": "Water (Hydrologic) Cycle",
"u": "U2",
"d": "The continuous movement of water through evaporation, transpiration, condensation, precipitation, infiltration, and runoff.",
"du": "D1"
},
{
"t": "Transpiration",
"u": "U2",
"d": "Release of water vapor from plant leaves into the atmosphere.",
"du": "D1"
},
{
"t": "Biodiversity",
"u": "U3",
"d": "The variety of life at three levels: genetic diversity, species diversity, and ecosystem diversity.",
"du": "D1"
},
{
"t": "Species Richness",
"u": "U3",
"d": "The number of different species in an area.",
"du": "D1"
},
{
"t": "Species Evenness",

const TUTOR_NAME = "TEAL";
const LS_STAR='envsci_glossary_starred', LS_QS='envsci_glossary_quizscore', LS_SRS='envsci_glossary_srs', LS_QT='envsci_glossary_quiztotals';
let starred = new Set(lsGet(LS_STAR,[]));
let srs = lsGet(LS_SRS,{});
let qt = lsGet(LS_QT,{c:0,t:0});
let curUnit='all', curShow='all';
function setUnit(u,b){ curUnit=u; document.querySelectorAll('.pill[data-unit]').forEach(x=>x.classList.toggle('active',x===b)); render(); }
function setShow(s,b){ curShow=s; document.querySelectorAll('.pill[data-show]').forEach(x=>x.classList.toggle('active',x===b)); render(); }
function idOf(t){ return t.t.replace(/[^a-zA-Z0-9]/g,'_'); }
function toggleStar(i){ const k=TERMS[i].t; starred.has(k)?starred.delete(k):starred.add(k); lsSet(LS_STAR,[...starred]); render(); }
function filtered(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  return TERMS.map((t,i)=>({t,i})).filter(({t})=>{
    if(curUnit!=='all'&&t.u!==curUnit) return false;
    if(curShow==='star'&&!starred.has(t.t)) return false;
    if(curShow==='du'&&!t.du) return false;
    if(q&&!(t.t+' '+t.d+' '+(t.ex||'')).toLowerCase().includes(q)) return false;
    return true;
  });
}
const openTutors = new Set();
function render(){
  const list=filtered();
  document.getElementById('s-star').textContent=starred.size;
  const letters=new Set(list.map(x=>x.t.t[0].toUpperCase()));
  document.getElementById('alpha').innerHTML='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map(l=>`<a href="#L-${l}" class="${letters.has(l)?'':'off'}">${l}</a>`).join('');
  if(!list.length){ document.getElementById('list').innerHTML='<div class="empty">No terms match. Try a different search or filter.</div>'; return; }
  let html='', last='';
  list.forEach(({t,i})=>{
    const L=t.t[0].toUpperCase();
    if(L!==last){ html+=`<div class="letter" id="L-${L}">${L}</div>`; last=L; }
    const id=idOf(t), on=starred.has(t.t);
    html+=`<div class="term">
      <div class="term-top"><div><div class="term-name">${esc(t.t)}</div>
        <div class="term-tags"><span class="tag t-unit">${t.u} · ${esc(UNIT_NAMES[t.u])}</span>${t.du&&DOMAINS[t.du]?`<span class="tag t-du">🦆 DU · ${esc(DOMAINS[t.du].name)}</span>`:''}</div></div>
        <button class="star ${on?'on':''}" onclick="toggleStar(${i})" aria-label="${on?'Unstar':'Star'} ${esc(t.t)}" aria-pressed="${on}">${on?'★':'☆'}</button></div>
      <div class="term-def">${esc(t.d)}</div>
      ${t.ex?`<div class="term-ex">${esc(t.ex)}</div>`:''}
      <button class="tutor-toggle" onclick="toggleTutor(${i})">💬 Ask ${TUTOR_NAME} about this</button>
      <div class="tutor ${openTutors.has(i)?'open':''}" id="tu-${i}">
        <div class="chat" id="ch-${i}"></div>
        <div class="chips"><button class="chip" onclick="askT(${i},'Give me an example')">Example</button><button class="chip" onclick="askT(${i},'Explain it a simpler way')">Simpler</button><button class="chip" onclick="askT(${i},'What do students mix this up with?')">Common mix-up</button></div>
        <div class="trow"><input class="tin" id="ti-${i}" placeholder="Ask your own question…" onkeydown="if(event.key==='Enter')askT(${i})"><button class="btn btn-accent" style="padding:8px 14px" onclick="askT(${i})">Ask</button></div>
        <div class="tmode">${esc(StudyHubTutor.modeLabel())}</div>
      </div>
    </div>`;
  });
  document.getElementById('list').innerHTML=html;
  openTutors.forEach(i=>restoreChat(i));
}
// ── Tutor ──
const chats={};
function toggleTutor(i){ openTutors.has(i)?openTutors.delete(i):openTutors.add(i); document.getElementById('tu-'+i).classList.toggle('open'); }
function restoreChat(i){ const c=document.getElementById('ch-'+i); if(!c||!chats[i]) return; c.innerHTML=chats[i].ui.map(([r,t])=>`<div class="bub ${r}">${fmt(t)}</div>`).join(''); }
function fmt(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\n/g,'<br>'); }
function related(t){ return TERMS.filter(x=>x!==t&&x.u===t.u).slice(0,40).filter(x=>{ const w=t.t.toLowerCase().split(/[^a-z]+/).filter(s=>s.length>4); return w.some(s=>x.d.toLowerCase().includes(s)); }).map(x=>x.t).slice(0,3); }
async function askT(i,preset){
  const t=TERMS[i]; const inp=document.getElementById('ti-'+i);
  const msg=(preset||inp.value).trim(); if(!msg) return; inp.value='';
  const c = chats[i] = chats[i] || {hist:[{role:'user',content:`TERM: ${t.t} | Unit: ${UNIT_NAMES[t.u]}\nDefinition: ${t.d}\n${t.ex?'Example: '+t.ex:''}`},{role:'assistant',content:'Ready.'}], ui:[]};
  c.ui.push(['u',msg]); c.hist.push({role:'user',content:msg}); restoreChat(i);
  const res = await StudyHubTutor.ask({
    system:`You are ${TUTOR_NAME}, a Environmental Science Honors tutor inside a glossary. Keep replies to 2-4 sentences, plain text, high-school friendly. Add a new angle, a Florida or wildlife example, or a common misconception; never just repeat the definition. Redirect off-topic questions warmly.`,
    messages:c.hist, context:{term:t.t, def:t.d, example:t.ex, unit:UNIT_NAMES[t.u], related:related(t)}, message:msg });
  c.ui.push(['a',res.text]); c.hist.push({role:'assistant',content:res.text}); if(c.hist.length>14) c.hist.splice(2,2);
  restoreChat(i);
}
// ── SRS helpers ──
function w(t){ const r=srs[t.t]; if(!r||!r.seen) return 3; return Math.max(1,1+(r.miss/r.seen)*6) * (starred.has(t.t)?1.5:1); }
function srsUp(t,ok){ const r=srs[t.t]||{seen:0,miss:0}; r.seen++; if(!ok) r.miss++; srs[t.t]=r; lsSet(LS_SRS,srs); }
function pickWeighted(pool,n){ const p=pool.map(t=>({t,w:w(t)})), out=[]; while(out.length<n&&p.length){ const tot=p.reduce((s,x)=>s+x.w,0); let r=Math.random()*tot,k=0; for(;k<p.length;k++){ r-=p[k].w; if(r<=0) break; } out.push(p.splice(Math.min(k,p.length-1),1)[0].t); } return out; }
function pool(){ const f=filtered().map(x=>x.t); return f.length>=4?f:TERMS; }
function closeOv(){ document.getElementById('ov').classList.remove('open'); render(); }
// ── Flip cards ──
let deck=[], di=0;
function openCards(){ deck=pickWeighted(pool(),Math.min(20,pool().length)); di=0; document.getElementById('ov').classList.add('open'); renderCard(); }
function renderCard(){
  const m=document.getElementById('modal');
  if(di>=deck.length){ m.innerHTML=`<div style="text-align:center;padding:20px"><div class="sec-lbl">DECK DONE</div><div style="font-size:15px;margin:8px 0 16px">Cards you marked "Again" will come up more often next time.</div><button class="btn btn-accent" onclick="openCards()">New deck</button> <button class="btn btn-ghost" onclick="closeOv()">Close</button></div>`; return; }
  const t=deck[di];
  m.innerHTML=`<div class="mtop"><span>CARD ${di+1} / ${deck.length}</span><button class="pill" onclick="closeOv()">✕ Close</button></div>
   <div class="fc" id="fc" onclick="this.classList.toggle('flip')" role="button" tabindex="0" aria-label="Flip card" onkeydown="if(event.key===' '||event.key==='Enter'){event.preventDefault();this.classList.toggle('flip')}"><div class="fc-inner">
     <div class="fc-face"><div class="fc-term">${esc(t.t)}</div><div class="fc-hint">Say the definition out loud, then tap to flip</div></div>
     <div class="fc-face fc-back"><div>${esc(t.d)}${t.ex?`<div class="term-ex" style="text-align:left;margin-top:10px">${esc(t.ex)}</div>`:''}</div></div>
   </div></div>
   <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-ghost" onclick="rate(false)">↺ Again</button><button class="btn btn-teal" onclick="rate(true)">✓ Got it</button></div>`;
}
function rate(ok){ srsUp(deck[di],ok); game().event('flashcard'); di++; renderCard(); }
// ── Quiz ──
let qz=null;
function openQuiz(){ const p=pool(); qz={items:pickWeighted(p,Math.min(10,p.length)),i:0,right:0,ans:false,p}; document.getElementById('ov').classList.add('open'); renderQ(); }
function renderQ(){
  const m=document.getElementById('modal');
  if(qz.i>=qz.items.length){
    const pct=Math.round(qz.right/qz.items.length*100); localStorage.setItem(LS_QS, pct+'%');
    document.getElementById('s-quiz').textContent = qt.t?Math.round(qt.c/qt.t*100)+'%':'—';
    m.innerHTML=`<div style="text-align:center;padding:20px"><div class="sec-lbl">QUIZ COMPLETE</div><div style="font-size:40px;font-weight:800;font-family:'DM Mono',monospace;color:#fff">${qz.right}/${qz.items.length}</div><div style="color:var(--muted);margin:6px 0 16px">Missed terms are weighted to show up again sooner.</div><button class="btn btn-accent" onclick="openQuiz()">Another round</button> <button class="btn btn-ghost" onclick="closeOv()">Close</button></div>`; return;
  }
  const t=qz.items[qz.i]; qz.ans=false;
  const others=shuffle(TERMS.filter(x=>x!==t&&(x.u===t.u||Math.random()<.3))).slice(0,3);
  qz.opts=shuffle([t,...others]);
  m.innerHTML=`<div class="mtop"><span>QUESTION ${qz.i+1} / ${qz.items.length}</span><span>${qz.right} correct</span><button class="pill" onclick="closeOv()">✕</button></div>
    <div class="q-def">${esc(t.d)}</div>
    <div class="opts">${qz.opts.map((o,k)=>`<button class="opt" id="qo-${k}" onclick="pickQ(${k})"><span class="opt-key">${'ABCD'[k]}</span><span>${esc(o.t)}</span></button>`).join('')}</div>
    <div class="fb" id="qfb"></div>`;
}
function pickQ(k){
  if(qz.ans) return; qz.ans=true;
  const t=qz.items[qz.i], ok=qz.opts[k]===t;
  if(ok) qz.right++; qt.t++; if(ok) qt.c++; lsSet(LS_QT,qt);
  srsUp(t,ok); game().answer(ok,1);
  qz.opts.forEach((o,j)=>{ const b=document.getElementById('qo-'+j); b.disabled=true; if(o===t) b.classList.add('correct'); else if(j===k) b.classList.add('wrong'); });
  const fb=document.getElementById('qfb'); fb.classList.add('show');
  fb.innerHTML=`<b style="color:${ok?'#4fd1a5':'#f08579'}">${ok?'✓ Correct':'✗ It was '+esc(t.t)}</b>${t.ex?' — '+esc(t.ex):''}<div style="margin-top:12px"><button class="btn btn-accent" onclick="qz.i++;renderQ()">Next →</button></div>`;
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&document.getElementById('ov').classList.contains('open')) closeOv(); });
(function init(){
  document.getElementById('s-total').textContent=TERMS.length;
  if(qt.t) document.getElementById('s-quiz').textContent=Math.round(qt.c/qt.t*100)+'%';
  const units=new Set(TERMS.map(t=>t.u)).size, du=TERMS.filter(t=>t.du).length;
  document.getElementById('page-sub').textContent=`${TERMS.length} terms · ${units} units${du?` · ${du} tagged for the DU certification`:''} · flip cards, spaced-repetition quiz, ${TUTOR_NAME} tutor`;
  const p=new URLSearchParams(location.search);
  const qu=p.get('unit'); const b=qu&&(document.querySelector('.pill[data-unit="'+qu+'"]')||document.querySelector('.pill[data-unit="U'+qu+'"]'));
  if(p.get('show')==='du'){ const d=document.querySelector('.pill[data-show="du"]'); if(d){ curShow='du'; document.querySelectorAll('.pill[data-show]').forEach(x=>x.classList.toggle('active',x===d)); } }
  if(b) setUnit(b.dataset.unit,b); else render();
})();
</script>
