<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Algebra 2 — Mistakes Autopsy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1B3A6B;--sky:#2E8BC0;--teal:#1D9E75;--amber:#E59400;--red:#E74C3C;--purple:#8B5CF6;
  --bg:#060e1a;--card:#0a1929;--card2:#0d1e32;--border:#1e3a5c;
  --text:#e8edf4;--muted:#6b8ab0;--white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(231,76,60,0.05) 0%,transparent 50%),radial-gradient(circle at 80% 80%,rgba(27,58,107,0.08) 0%,transparent 50%);pointer-events:none;z-index:0}

.app{max-width:920px;margin:0 auto;padding:0 16px 80px;position:relative;z-index:1}
.header{padding:28px 0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.header-left{display:flex;flex-direction:column;gap:4px}
.series-label{font-size:10px;font-weight:700;color:var(--red);letter-spacing:.14em;text-transform:uppercase}
.page-title{font-size:28px;font-weight:800;color:var(--white);letter-spacing:-.3px}
.page-title span{color:var(--red)}
.header-actions{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;border:1px solid transparent;transition:all .2s;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--muted)}
.pill-sky{background:rgba(46,139,192,.12);color:var(--sky);border-color:rgba(46,139,192,.25)}
.pill-sky:hover,.pill-sky.active{background:rgba(46,139,192,.25);border-color:var(--sky)}
.pill-red{background:rgba(231,76,60,.12);color:var(--red);border-color:rgba(231,76,60,.25)}
.pill-red:hover,.pill-red.active{background:rgba(231,76,60,.25);border-color:var(--red)}
.pill-navy{background:rgba(27,58,107,.4);color:var(--muted);border-color:var(--border)}
.pill-navy:hover,.pill-navy.active{background:rgba(27,58,107,.7);color:var(--text);border-color:var(--sky)}
.pill-teal{background:rgba(29,158,117,.12);color:var(--teal);border-color:rgba(29,158,117,.25)}
.pill-teal:hover,.pill-teal.active{background:rgba(29,158,117,.25);border-color:var(--teal)}

.stats-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.stat-chip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:96px}
.stat-num{font-family:'DM Mono',monospace;font-size:20px;font-weight:800;color:var(--white);line-height:1}
.stat-lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-top:3px}

.controls{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:18px;display:flex;flex-direction:column;gap:12px}
.ctrl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ctrl-label{font-family:'DM Mono',monospace;font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--muted);min-width:56px}
.search-wrap{flex:1;min-width:200px;position:relative}
.search-input{width:100%;padding:9px 14px 9px 34px;border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;font-size:13px}
.search-input:focus{outline:none;border-color:var(--red)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);font-size:13px;opacity:.5}
.view-toggle{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-left:auto}
.view-btn{padding:7px 14px;font-size:11px;font-weight:700;background:transparent;border:none;color:var(--muted);cursor:pointer;font-family:'DM Sans',sans-serif}
.view-btn.active{background:rgba(231,76,60,.15);color:var(--red)}

.launch-fmm{background:linear-gradient(135deg,#8558EC,#6d3fd4);color:#fff;border:none;padding:10px 20px;font-size:13px;font-weight:800;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif;display:inline-flex;align-items:center;gap:6px}
.launch-fmm:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(139,92,246,.3)}

.mistake{background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:16px;overflow:hidden}
.mistake.mastered{border-color:rgba(29,158,117,.4)}
.m-head{padding:14px 18px;background:var(--card2);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;cursor:pointer}
.m-num{font-family:'DM Mono',monospace;font-size:11px;font-weight:700;color:#fff;background:var(--navy);padding:3px 9px;border-radius:6px}
.m-title{font-size:14.5px;font-weight:700;color:var(--white);flex:1}
.m-tags{display:flex;gap:6px;align-items:center}
.unit-tag{font-size:10px;font-weight:700;color:var(--sky);background:rgba(46,139,192,.12);border:1px solid rgba(46,139,192,.25);padding:2px 8px;border-radius:6px}
.mastered-badge{font-size:10px;font-weight:700;color:var(--teal);background:rgba(29,158,117,.15);border:1px solid rgba(29,158,117,.3);padding:2px 8px;border-radius:6px}
.m-body{padding:0 18px 18px;display:none}
.mistake.open .m-body{display:block}
.why-bar{background:rgba(229,148,0,.08);border-left:3px solid var(--amber);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:12px;font-size:12.5px;line-height:1.6}
.why-bar b{color:var(--amber);display:block;font-size:9.5px;letter-spacing:.1em;margin-bottom:4px;font-family:'DM Mono',monospace}
.compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:640px){.compare-grid{grid-template-columns:1fr}}
.wrong-col,.right-col{border-radius:10px;padding:12px 14px;font-family:'DM Mono',monospace;font-size:12px;line-height:1.7;white-space:pre-wrap}
.wrong-col{background:rgba(231,76,60,.07);border:1px solid rgba(231,76,60,.25)}
.right-col{background:rgba(29,158,117,.07);border:1px solid rgba(29,158,117,.25)}
.col-lbl{font-family:'DM Sans',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.1em;margin-bottom:6px;display:block}
.wrong-col .col-lbl{color:var(--red)}
.right-col .col-lbl{color:var(--teal)}
.memory-bar{background:rgba(139,92,246,.08);border-left:3px solid var(--purple);border-radius:0 8px 8px 0;padding:10px 14px;margin-bottom:10px;font-size:12.5px;font-weight:600;color:#c4b5fd}
.memory-bar b{color:var(--purple);display:block;font-size:9.5px;letter-spacing:.1em;margin-bottom:4px;font-family:'DM Mono',monospace;font-weight:700}
.watchout-bar{background:var(--bg);border:1px dashed var(--border);border-radius:8px;padding:10px 14px;font-size:12px;color:var(--muted);margin-bottom:12px}
.watchout-bar b{color:var(--text);display:block;font-size:9.5px;letter-spacing:.1em;margin-bottom:4px;font-family:'DM Mono',monospace}
.m-actions{display:flex;gap:8px}
.btn-small{border:1px solid var(--border);background:var(--bg);color:var(--muted);padding:7px 14px;border-radius:9px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-small:hover{border-color:var(--sky);color:var(--text)}
.btn-small.on{background:rgba(29,158,117,.15);border-color:var(--teal);color:var(--teal)}

.compact .m-body{display:none!important}
.compact .m-head{padding:11px 16px}

.empty{text-align:center;padding:50px 20px;color:var(--muted);font-size:14px}

/* FMM overlay */
.fmm-overlay{position:fixed;inset:0;background:rgba(6,14,26,.95);z-index:300;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:30px 16px 60px}
.fmm-overlay.open{display:flex}
.fmm-wrap{width:100%;max-width:640px}
.fmm-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.fmm-title{font-size:19px;font-weight:800;color:var(--white)}
.fmm-close{background:none;border:1px solid var(--border);border-radius:50%;width:34px;height:34px;color:var(--muted);cursor:pointer;font-size:16px}
.fmm-card{background:var(--card);border:1.5px solid var(--border);border-radius:18px;padding:22px;margin-bottom:16px}
.fmm-prompt-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--red);letter-spacing:.1em;margin-bottom:10px}
.fmm-wrong-shown{font-family:'DM Mono',monospace;font-size:12.5px;line-height:1.7;white-space:pre-wrap;background:rgba(231,76,60,.06);border:1px solid rgba(231,76,60,.2);border-radius:10px;padding:14px;margin-bottom:16px}
.fmm-choices{display:grid;gap:8px}
.fmm-opt{padding:11px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text);text-align:left;font-family:'DM Sans',sans-serif;font-size:12.5px;cursor:pointer}
.fmm-opt:hover:not(:disabled){border-color:var(--red)}
.fmm-opt.correct{border-color:var(--teal)!important;background:rgba(29,158,117,.1)!important}
.fmm-opt.wrong{border-color:var(--red)!important;background:rgba(231,76,60,.08)!important}
.fmm-nav{display:flex;gap:10px;justify-content:center;align-items:center}
.fmm-score{font-size:13px;color:var(--muted)}
.btn-fmm-next{background:linear-gradient(135deg,#8558EC,#6d3fd4);color:#fff;border:none;padding:11px 26px;font-weight:800;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
.btn-fmm-exit{background:var(--bg);border:1px solid var(--border);color:var(--muted);padding:11px 18px;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif}
</style>
</head>

<script>
// ═══════════════════════════════════════════
// ALGEBRA 2 — MISTAKES AUTOPSY
// 25 high-frequency errors, U1-U10. Same 7-field format throughout:
// id, unit, title, category, why, wrong, right, memory, watchout, fmm_wrong, fmm_choices
// fmm_choices[0] is always the correct diagnosis.
// ═══════════════════════════════════════════
const MISTAKES = [
{
  id:1, unit:"U1", title:"Forgetting to Restrict the Domain Before Solving",
  category:"Domain & Range",
  why:"Students find the algebraic answer first and only think about domain restrictions afterward, if at all — but for square roots and rational expressions, the restriction has to be checked before the answer is trusted.",
  wrong:`Find the domain of f(x) = √(x − 4).
Student solves: x − 4 = 0, so x = 4.
States: "Domain is x = 4."
Treats the radical like an equation to solve, not an inequality to satisfy.`,
  right:`The radicand must be ≥ 0, not = 0.
Set up an inequality: x − 4 ≥ 0.
Solve: x ≥ 4.
Domain: [4, ∞) — every x-value from 4 upward, not just x = 4.`,
  memory:'"Radicand ≥ 0, not = 0." A square root domain is a whole ray, not a single point.',
  watchout:"For rational functions, the restriction is the OPPOSITE inequality — the denominator must NOT equal zero, so you solve an equation and then EXCLUDE that value, rather than solving an inequality and keeping a range.",
  fmm_wrong:`Find the domain of f(x) = √(2x + 6).
Student sets 2x + 6 = 0, gets x = −3, and writes "Domain: x = −3."`,
  fmm_choices:["The radicand must be ≥ 0, not = 0 — correct domain is x ≥ −3, an inequality not a single point","x = −3 is correct because that's where the function is undefined","The student should have set 2x + 6 &lt; 0 instead","The domain should exclude x = −3, not include only it"]
},
{
  id:2, unit:"U1", title:"Losing Track of Operation Order in Composite Functions",
  category:"Composition of Functions",
  why:"Students read (f ∘ g)(x) left to right like a sentence and apply f first, when the notation actually means \"apply g first, then feed the result into f.\"",
  wrong:`If f(x) = 3x − 1 and g(x) = x² + 2, find (f ∘ g)(2).
Student computes f(2) first: f(2) = 3(2) − 1 = 5.
Then plugs into g: g(5) = 25 + 2 = 27.
States: "(f ∘ g)(2) = 27."`,
  right:`(f ∘ g)(x) means f(g(x)) — apply g FIRST, then f to that result.
Step 1: g(2) = (2)² + 2 = 6.
Step 2: f(6) = 3(6) − 1 = 17.
(f ∘ g)(2) = 17.`,
  memory:'"Read right to left, work left to right." The rightmost function in the notation is the one you compute FIRST.',
  watchout:"(f ∘ g)(x) and (g ∘ f)(x) are almost never equal — always check which function's letter sits closer to the input before starting.",
  fmm_wrong:`f(x) = x + 5, g(x) = 2x. Find (g ∘ f)(3).
Student computes g(3) = 6 first, then f(6) = 11.`,
  fmm_choices:["(g ∘ f)(x) means g(f(x)) — f should be applied first: f(3) = 8, then g(8) = 16","The student's answer of 11 is correct","The order doesn't matter for composition, so either approach works","g(3) should have been computed as 2(3)+5 instead"]
},
{
  id:3, unit:"U2", title:"Ignoring the Leading Coefficient's Sign in End Behavior",
  category:"End Behavior",
  why:"Students correctly identify whether the degree is even or odd but forget that the SIGN of the leading coefficient flips the direction the ends point.",
  wrong:`Problem: Describe end behavior of f(x) = −3x⁴ + 2x − 1.
Student thinks: "Even degree — both ends go UP."
States: as x → ±∞, y → +∞.
Ignores the negative leading coefficient entirely.`,
  right:`Degree 4 is even. BUT leading coefficient is −3 (negative).
Negative LC FLIPS the even-degree behavior.
Even + positive LC: both ends go UP (+∞).
Even + negative LC: both ends go DOWN (−∞).
Correct: as x → +∞, y → −∞ AND as x → −∞, y → −∞.`,
  memory:'"Negative flips the ends." For even degree, negative LC = both ends DOWN (mountain becomes valley).',
  watchout:"For ODD degree with negative LC: right end goes DOWN, left end goes UP. Opposite of the positive-LC odd pattern.",
  fmm_wrong:`f(x) = −2x⁴ + x² − 7
Student says: "Degree is 4 (even), so both ends go to +∞."`,
  fmm_choices:["The student correctly identified the degree but ignored the negative leading coefficient — both ends go DOWN","The student should have found the vertex before describing end behavior","The student applied the odd-degree rule to an even-degree polynomial","The student is correct; even degree always means both ends go up"]
},
{
  id:4, unit:"U2", title:"Dropping the Remainder in Synthetic Division",
  category:"Synthetic Division",
  why:"Students complete the synthetic division table correctly but treat the last number as part of the quotient instead of the remainder.",
  wrong:`Divide x³ − x² − 4x + 4 by (x − 2).
Synthetic: 2 | 1  −1  −4   4
Result row: 1   1  −2   0
Student writes quotient as: x³ + x² − 2x + 0.
Degree of quotient is wrong.`,
  right:`The number of coefficients in the quotient = (degree of dividend) − 1.
Row: 1   1  −2  | 0 (remainder)
Quotient coefficients: 1, 1, −2 → x² + x − 2.
Remainder: 0 (means (x−2) is a factor).
Check: (x−2)(x²+x−2) = (x−2)(x+2)(x−1). ✓`,
  memory:'"Last number = remainder, not part of the quotient." Degree of quotient is always one less than the dividend.',
  watchout:"If a power of x is missing from the dividend (e.g., x³ + 2x − 1 has no x² term), insert a 0 placeholder or synthetic division will be wrong.",
  fmm_wrong:`Dividing x³ − 5x² + 3x + 9 by (x − 3).
Result row: 1  −2  −3  0
Student writes: quotient = x³ − 2x² − 3x.`,
  fmm_choices:["The quotient's degree should be one less than the dividend — correct quotient is x² − 2x − 3; the 0 is the remainder, not a term","The student should have used long division instead","The signs of all coefficients should be flipped","The student forgot to include the remainder as a fraction"]
},
{
  id:5, unit:"U2", title:"Confusing Multiplicity's Effect on the Graph",
  category:"Zeros & Multiplicity",
  why:"Students know that a root with multiplicity means a repeated factor but cannot translate that into the correct graph behavior at that x-intercept.",
  wrong:`f(x) = (x − 1)²(x + 3).
Student plots x-intercepts at x = 1 and x = −3.
Draws graph CROSSING through x = 1 (same as x = −3).
Treats both zeros identically, ignoring the exponent of 2 on the first factor.`,
  right:`Multiplicity determines whether the graph crosses or bounces at that zero.
x = 1 has multiplicity 2 (even) → graph TOUCHES the x-axis and turns back (bounces).
x = −3 has multiplicity 1 (odd) → graph CROSSES straight through.
The graph touches at x=1 and passes through at x=−3 — they look different.`,
  memory:'"Odd crosses, even bounces." Multiplicity 1, 3, 5… crosses; multiplicity 2, 4, 6… bounces off the axis.',
  watchout:"Higher even multiplicities (4, 6…) bounce with a flatter, more \"S-curve-like\" touch than multiplicity 2 — the graph flattens out more the higher the even multiplicity gets.",
  fmm_wrong:`f(x) = (x + 2)(x − 5)³.
Student draws the graph crossing at x = −2 and BOUNCING at x = 5.`,
  fmm_choices:["Multiplicity 3 is odd, so the graph CROSSES at x = 5, not bounces — the student reversed the rule","The student is correct; higher multiplicity always means bouncing","Both zeros should show bouncing behavior since one has an exponent","The graph should not touch the x-axis at either zero"]
},
{
  id:6, unit:"U3", title:"Forgetting the ± When Taking a Square Root",
  category:"Solving Quadratics",
  why:"Students isolate a squared term correctly, take the square root, but only report the positive root — losing half of the solution set.",
  wrong:`Solve: (x − 3)² = 16.
Student takes the square root of both sides: x − 3 = 4.
Solves: x = 7.
States: "The solution is x = 7."`,
  right:`Taking a square root of both sides introduces a ± — there are always two square roots.
x − 3 = ±4.
Case 1: x − 3 = 4 → x = 7.
Case 2: x − 3 = −4 → x = −1.
Two solutions: x = 7 and x = −1.`,
  memory:'"Square root of both sides means BOTH signs." Every time you undo a square, write ± immediately, before simplifying further.',
  watchout:"This is different from taking the square root of a single number under a radical sign (like √16 = 4, principal root only) — the ± only appears when you are UNDOING a squared expression to solve an equation.",
  fmm_wrong:`Solve (x + 2)² = 25.
Student writes x + 2 = 5, so x = 3, and stops there.`,
  fmm_choices:["Taking the square root of both sides requires ±5, giving two solutions: x = 3 and x = −7","x = 3 is the only solution since 25 is positive","The student should have expanded (x+2)² first before taking the root","The equation has no real solutions since a square can't equal 25"]
},
{
  id:7, unit:"U3", title:"Sign Error Substituting into the Quadratic Formula",
  category:"Quadratic Formula",
  why:"When b is already negative in the original equation, students substitute −b incorrectly, flipping a sign that should have cancelled.",
  wrong:`Solve 2x² − 3x − 2 = 0 using the quadratic formula.
Here a=2, b=−3, c=−2.
Student writes: x = [−(−3) ± √((−3)² − 4(2)(−2))] / 2(2)
Then simplifies −(−3) as −3 (sign error — should be +3).`,
  right:`x = [−b ± √(b² − 4ac)] / 2a.
b = −3, so −b = −(−3) = +3 (the two negatives cancel).
Discriminant: (−3)² − 4(2)(−2) = 9 + 16 = 25.
x = [3 ± 5] / 4 → x = 2 or x = −0.5.`,
  memory:'"Two negatives make a positive — every time." −(−3) is +3, not −3. Write the substitution step out fully before simplifying.',
  watchout:"The SAME sign error happens inside b² — squaring a negative b always gives a positive result: (−3)² = 9, never −9.",
  fmm_wrong:`Solve 3x² + 2x − 5 = 0. a=3, b=2, c=−5.
Student computes the discriminant as 2² − 4(3)(−5) = 4 − 60 = −56.`,
  fmm_choices:["The student mixed up the sign: −4(3)(−5) = +60, not −60 — discriminant is 4 + 60 = 64, not −56","The discriminant is correct; the equation has no real solutions","The student should have used −b² instead of b²","c should have been treated as positive 5 in this equation"]
},
{
  id:8, unit:"U3", title:"Treating i² as i Instead of −1",
  category:"Complex Numbers",
  why:"Students memorize that i = √(−1) but forget to actually substitute −1 when i² shows up during multiplication, leaving i² sitting in the answer unsimplified.",
  wrong:`Multiply (3 + 2i)(1 − i).
Student FOILs: 3 − 3i + 2i − 2i².
Combines like terms on the i-terms only: 3 − i − 2i².
States final answer: "3 − i − 2i²." Does not simplify i².`,
  right:`i² is DEFINED as −1 — it must be replaced, not left in the answer.
3 − 3i + 2i − 2i² = 3 − i − 2(−1) = 3 − i + 2 = 5 − i.
Every time i² appears during multiplication, immediately substitute −1.`,
  memory:'"i² is not a variable — it\'s a stand-in for −1." Replace it the instant it appears, same reflex as simplifying √4 to 2.',
  watchout:"Higher powers of i cycle every 4: i¹=i, i²=−1, i³=−i, i⁴=1, then it repeats. For i to a large power, divide the exponent by 4 and use the remainder.",
  fmm_wrong:`Simplify (2 + i)(3 + i).
Student expands to 6 + 2i + 3i + i² and writes the final answer as "6 + 5i + i²."`,
  fmm_choices:["i² must be replaced with −1: 6 + 5i + (−1) = 5 + 5i, not left as i² in the final answer","6 + 5i + i² is already fully simplified","i² should be replaced with 1, not −1","The student needs to also simplify the 5i term further"]
},
{
  id:9, unit:"U4", title:"Cancelling Terms Instead of Factors in Rational Expressions",
  category:"Simplifying Rational Expressions",
  why:"Students see a matching term in the numerator and denominator and cross it out, even when it's part of a sum rather than a factor of a product — cancellation only works on multiplied factors.",
  wrong:`Simplify (x + 3) / (x + 5).
Student "cancels" the x from numerator and denominator, as if x were a common factor.
Writes: 3/5.
Treats addition like multiplication.`,
  right:`You can only cancel FACTORS that are multiplied across the entire numerator and entire denominator — not terms that are added.
(x + 3) / (x + 5) does not factor further — x is not a factor of the whole numerator or the whole denominator, it's a term inside a sum.
This expression is already in simplest form; it cannot be reduced.`,
  memory:'"Cancel factors, never terms." If you can\'t draw a box around the ENTIRE numerator or denominator as one multiplied piece, you can\'t cancel it.',
  watchout:"This mistake also shows up with expressions like (x² − 4)/(x − 2) where cancelling IS valid — but only after factoring: (x−2)(x+2)/(x−2) = x+2. The factoring step must come first.",
  fmm_wrong:`Simplify (x² + 2x) / (x + 5).
Student cancels the x from x² and x in the numerator against nothing, then also cancels against the x+5, writing "2/5."`,
  fmm_choices:["Nothing can be cancelled here without factoring first — factor the numerator to x(x+2), and since (x+5) shares no common factor, the expression is already simplest form","2/5 is correct after simplifying","The x² should cancel with the x in x+5","The expression simplifies to x + 2/5"]
},
{
  id:10, unit:"U4", title:"Forgetting to Exclude Removable Discontinuities (Holes)",
  category:"Holes & Excluded Values",
  why:"After simplifying a rational function and a factor cancels cleanly, students forget that the ORIGINAL denominator's zero is still excluded from the domain — even though it disappeared algebraically.",
  wrong:`Simplify f(x) = (x² − 4)/(x − 2) and state the domain.
Student factors and cancels: (x−2)(x+2)/(x−2) = x + 2.
States: "f(x) = x + 2, domain is all real numbers" — since the simplified form has no denominator at all.`,
  right:`The ORIGINAL function was undefined at x = 2 (denominator = 0), and simplifying doesn't change that — it creates a HOLE at x = 2, not a removed restriction.
f(x) = x + 2, domain: x ≠ 2 (all reals except 2).
The graph looks like the line y = x + 2 but with an open circle at the point (2, 4).`,
  memory:'"Cancelling creates a hole, it doesn\'t erase the restriction." Always check the ORIGINAL denominator for excluded values before simplifying.',
  watchout:"A hole (removable discontinuity) is different from a vertical asymptote — a hole comes from a factor that cancels; an asymptote comes from a factor that does NOT cancel and remains in the denominator.",
  fmm_wrong:`Simplify g(x) = (x² − 9)/(x − 3). Student simplifies to x + 3 and states "domain is all real numbers."`,
  fmm_choices:["The original denominator is zero at x = 3, so even after simplifying to x+3, the domain must exclude x = 3 (a hole at that point)","All real numbers is correct since the simplified form has no denominator","The domain should exclude x = −3 instead of x = 3","x + 3 is not a valid simplification of this expression"]
},
{
  id:11, unit:"U4", title:"Applying the Wrong Horizontal Asymptote Rule",
  category:"Horizontal Asymptotes",
  why:"Students memorize one horizontal asymptote rule and apply it regardless of the relationship between the numerator's and denominator's degrees, without checking which of the three cases actually applies.",
  wrong:`f(x) = (2x + 1) / (x² − 9).
Student assumes HA = leading coefficient ratio = 2/1 = 2, without checking the degrees.
States: "Horizontal asymptote is y = 2."`,
  right:`THREE cases for horizontal asymptotes, based on comparing degrees:
Case 1: deg(num) &lt; deg(den) → HA: y = 0
Case 2: deg(num) = deg(den) → HA: y = leading coeff ratio
Case 3: deg(num) &gt; deg(den) → NO horizontal asymptote
Here: numerator degree 1, denominator degree 2 → Case 1 applies. HA is y = 0, not y = 2.`,
  memory:'"Less = Zero, Equal = Ratio, Greater = None (or Slant)." Check degrees FIRST, every single time, before reaching for a ratio.',
  watchout:"When deg(num) = deg(den) + 1 exactly (Case 3, one degree higher), there IS a slant asymptote — found by polynomial long division, not by comparing leading coefficients.",
  fmm_wrong:`f(x) = (5x²) / (x + 1). Student says "HA = 5/1 = 5" without checking degrees.`,
  fmm_choices:["Degree of numerator (2) is greater than denominator (1), so there is no horizontal asymptote — there's a slant asymptote instead, found by long division","HA = 5 is correct since 5 is the leading coefficient","HA = 0 because the denominator has a lower degree","The function has two horizontal asymptotes, y=5 and y=0"]
},
{
  id:12, unit:"U4", title:"Applying a Single Horizontal Asymptote Rule Without Checking Degrees",
  category:"Horizontal Asymptotes",
  why:"Students apply one rule to every rational function without checking which of the three degree-comparison cases actually applies to the specific function in front of them.",
  wrong:`f(x) = (3x² + 1) / (x² − 4).
Student states: "Numerator degree is higher, so HA = 0."
Or: "HA = numerator leading coefficient / 1 = 3."
Applied one rule without checking degrees first.`,
  right:`THREE cases for horizontal asymptotes:
Case 1: deg(num) &lt; deg(den) → HA: y = 0
Case 2: deg(num) = deg(den) → HA: y = leading coeff(num) / leading coeff(den)
Case 3: deg(num) &gt; deg(den) → NO horizontal asymptote
Here: both degrees = 2 (equal). HA = 3/1 = 3. So y = 3. ✓`,
  memory:'"Less = Zero, Equal = Ratio, Greater = None (or Slant)." Check degrees FIRST.',
  watchout:"When deg(num) = deg(den) + 1, use polynomial long division to find the SLANT asymptote. It is not zero.",
  fmm_wrong:`f(x) = (4x³ − 1) / (x² + 2x)
Student says: "HA = 4/1 = 4."`,
  fmm_choices:["Degree of numerator (3) &gt; degree of denominator (2) — no horizontal asymptote; there is a SLANT asymptote","The student is correct; 4 is the HA because degrees are close","HA = 0 because the numerator degree is higher","HA = 1 because the leading coefficient of the denominator is 1"]
},
{
  id:13, unit:"U5", title:"Failing to Check for Extraneous Solutions",
  category:"Radical Equations",
  why:"Squaring both sides is an irreversible step that can introduce false solutions. Students solve the resulting quadratic but do not verify answers in the original equation.",
  wrong:`Solve: √(x + 3) = x − 3.
Square both sides: x + 3 = x² − 6x + 9.
x² − 7x + 6 = 0 → (x−1)(x−6) = 0.
Solutions: x = 1 and x = 6. Done.
(Did NOT check either solution.)`,
  right:`After solving: x = 1 and x = 6. CHECK BOTH.
Check x = 1: √(1+3) = √4 = 2. But x − 3 = 1 − 3 = −2. 2 ≠ −2. EXTRANEOUS. ✗
Check x = 6: √(6+3) = √9 = 3. And x − 3 = 6 − 3 = 3. 3 = 3. VALID. ✓
Only solution: x = 6. Discarding x = 1 is essential.`,
  memory:'"Square it? Check it." Every time you square both sides, you MUST verify in the original. No exceptions.',
  watchout:"If the right side of a radical equation is a negative number (e.g., √x = −5), STOP immediately. Principal square root is never negative — no solution exists.",
  fmm_wrong:`Solve: √(x − 4) = −3.
Student squares both sides: x − 4 = 9 → x = 13.
States: "x = 13 is the solution."`,
  fmm_choices:["The principal square root is never negative — √(x−4) cannot equal −3, so the equation has NO solution before squaring","x = 13 is correct because √9 = ±3","The student should have squared the left side first","The student needed to add 4 to both sides before squaring"]
},
{
  id:14, unit:"U5", title:"Incorrect Order of Operations with Rational Exponents",
  category:"Rational Exponents",
  why:"Students confuse which part of x^(m/n) is the power and which is the root, often computing in the wrong order or applying the wrong operation entirely.",
  wrong:`Simplify: 27^(2/3).
ERROR 1: Student computes 27 × (2/3) = 18. (Multiplied instead of exponentiating.)
ERROR 2: (27)² / 3 = 729/3 = 243. (Applied division instead of root.)
Both treat the fractional exponent as an arithmetic operation on 27 rather than a power-and-root instruction.`,
  right:`x^(m/n) means: take the n-th root, then raise to the m power (or either order — root first is usually easier with smaller numbers).
27^(2/3) = (³√27)² = (3)² = 9.
Root first (n-th root, here cube root), THEN apply the power (m), not multiplication or division.`,
  memory:'"Bottom is the root, top is the power." For x^(m/n): n (bottom) tells you which root; m (top) tells you which power. Do the root first to keep numbers small.',
  watchout:"A negative rational exponent still means reciprocal first: x^(−m/n) = 1 / x^(m/n) — don't forget to flip before applying the root and power.",
  fmm_wrong:`Simplify 8^(2/3).
Student computes 8 × 2 ÷ 3 = 5.33, and writes "8^(2/3) ≈ 5.33."`,
  fmm_choices:["8^(2/3) means (cube root of 8)² = 2² = 4 — it's a root-and-power operation, not multiplication and division","5.33 is the correct simplified value","The student should have computed 8² first, then divided by 3","8^(2/3) simplifies to 8 − 2/3"]
},
{
  id:15, unit:"U6", title:"Confusing the Product Property with Sum Inside a Log",
  category:"Logarithm Properties",
  why:"Students see log(x + y) and try to apply the product property, not realizing the product property only applies to log(xy) — a sum inside a log doesn't simplify at all using log rules.",
  wrong:`A student says log(x + y) = log(x) + log(y).
Applies the product property to what looks like a similar-looking expression.
Treats addition inside the log the same as multiplication inside the log.`,
  right:`The Product Property states: log_b(x · y) = log_b(x) + log_b(y) — it applies to a PRODUCT inside the log, not a sum.
log(x + y) does NOT simplify further using any logarithm property. It has no equivalent expanded form.
The student confused log(xy) — which DOES expand — with log(x+y), which does not.`,
  memory:'"Logs split products, never sums." If it\'s x+y inside the log, there is nothing more you can do with properties — leave it as is.',
  watchout:"The same confusion happens with the quotient property: log(x/y) = log(x) − log(y) applies to DIVISION inside the log, not to log(x) − log(y) being rewritten as log(x−y) — that direction is also invalid.",
  fmm_wrong:`Student simplifies log(a) − log(b) as log(a − b).`,
  fmm_choices:["This reverses the Quotient Property — log(a) − log(b) = log(a/b), a quotient, not log(a−b)","log(a−b) is a valid simplification of log(a) − log(b)","The student should have added instead of subtracted","Neither expression can be simplified further"]
},
{
  id:16, unit:"U6", title:"Forgetting to Apply Change of Base Correctly",
  category:"Change of Base Formula",
  why:"Students remember there's a change-of-base formula but flip the numerator and denominator, or forget which log goes on top.",
  wrong:`Evaluate log₅(20) using a calculator (which only has log base 10).
Student writes: log₅(20) = log(5) / log(20).
Puts the BASE on top instead of the argument.`,
  right:`Change of Base Formula: log_b(x) = log(x) / log(b) — the ARGUMENT (x) goes on top, the BASE (b) goes on the bottom.
log₅(20) = log(20) / log(5) = 1.301 / 0.699 ≈ 1.861.
Flipping the formula gives a completely different (and wrong) value.`,
  memory:'"Argument on top, base on bottom — same order as the original expression, just stacked as a fraction."',
  watchout:"This formula works with natural log (ln) just as well as common log (log base 10) — log_b(x) = ln(x)/ln(b) gives the identical answer, just using a different calculator button.",
  fmm_wrong:`Evaluate log₃(50). Student writes log(3)/log(50) and gets approximately 0.269.`,
  fmm_choices:["The formula is backwards — it should be log(50)/log(3), giving approximately 3.56, not log(3)/log(50)","0.269 is the correct value of log₃(50)","The student should have used ln instead of log","log₃(50) cannot be evaluated with a base-10 calculator"]
},
{
  id:17, unit:"U6", title:"Treating Exponential Growth and Linear Growth the Same Way",
  category:"Exponential Models",
  why:"Students set up growth problems by adding a percentage once, like a one-time linear increase, rather than recognizing that percentage growth compounds multiplicatively over each time period.",
  wrong:`A population of 500 grows 8% per year. Find the population after 3 years.
Student computes: 500 + (500 × 0.08 × 3) = 500 + 120 = 620.
Treats the growth as a flat percentage added once per year, added together linearly.`,
  right:`Exponential growth compounds — each year's growth is based on the NEW total, not the original amount.
Formula: P(t) = P₀(1 + r)^t.
P(3) = 500(1.08)³ = 500(1.2597) ≈ 630.
The difference (630 vs 620) grows larger every additional year — that's what makes it exponential, not linear.`,
  memory:'"Percent growth means multiply, not add." Each period multiplies by (1 + r); it never just adds r × original once per period.',
  watchout:"Continuous growth (using base e: A = Pe^(rt)) grows slightly faster than compounding once per year at the same rate — don't mix up the two formulas.",
  fmm_wrong:`A $2000 investment grows at 5% annually. Student estimates the value after 4 years as 2000 + (2000)(0.05)(4) = $2400.`,
  fmm_choices:["Growth compounds: P(4) = 2000(1.05)⁴ ≈ $2431, not a flat linear addition of $400","$2400 is the correct compounded value","The formula should use subtraction since the rate is a percentage","Compounding only applies to loans, not investments"]
},
{
  id:18, unit:"U7", title:"Mixing Up Arithmetic and Geometric Sequence Formulas",
  category:"Sequences",
  why:"Students see a sequence, correctly identify a pattern, but reach for the wrong formula — using the common DIFFERENCE formula on a sequence that actually has a common RATIO, or vice versa.",
  wrong:`Find the 6th term of 3, 6, 12, 24, ...
Student assumes arithmetic (thinks the pattern is "+3, then doubling coincidentally") and uses a_n = a_1 + (n−1)d with d = 3.
a_6 = 3 + 5(3) = 18. (Incorrect — this sequence is geometric, not arithmetic.)`,
  right:`Check FIRST: is there a common DIFFERENCE (arithmetic) or a common RATIO (geometric)?
3, 6, 12, 24: each term is DOUBLE the previous (ratio r = 2), not a constant difference. This is geometric.
Use a_n = a_1 · r^(n−1): a_6 = 3 · 2⁵ = 3 · 32 = 96.`,
  memory:'"Subtract to check arithmetic, divide to check geometric." Always test BOTH before picking a formula — never assume from the first two terms alone.',
  watchout:"Some sequences are neither arithmetic nor geometric (e.g., 1, 4, 9, 16 — square numbers). If neither a constant difference nor a constant ratio appears, neither formula applies.",
  fmm_wrong:`Find the 5th term of 2, 6, 18, 54, ...
Student uses a_n = a_1 + (n−1)d with d = 4 (from 6−2), getting a_5 = 2 + 4(4) = 18.`,
  fmm_choices:["This sequence has a common RATIO of 3 (geometric), not a common difference — correct formula gives a_5 = 2(3)⁴ = 162","18 is correct since d = 4 was calculated properly","The sequence is arithmetic with d = 16","Both formulas give the same answer for this sequence"]
},
{
  id:19, unit:"U7", title:"Applying the Infinite Sum Formula When |r| ≥ 1",
  category:"Infinite Geometric Series",
  why:"Students memorize the formula S = a₁/(1−r) but plug in values without first checking whether the series actually converges — the formula produces a nonsense answer if it's used when it doesn't apply.",
  wrong:`Find the sum of the infinite series: 3 + 6 + 12 + 24 + ...
Student identifies a_1 = 3, r = 2, and plugs into S = a_1/(1−r).
S = 3/(1−2) = 3/(−1) = −3.
States: "The sum is −3."`,
  right:`The infinite sum formula ONLY applies when |r| &lt; 1 — otherwise the series diverges (grows without bound) and has NO finite sum.
Here r = 2, and |2| = 2, which is NOT less than 1.
This series diverges. There is no finite sum — the formula should never have been applied.`,
  memory:'"Check |r| &lt; 1 BEFORE reaching for the formula." If the ratio is 1 or bigger in absolute value, the series has no sum at all — stop there.',
  watchout:"A negative ratio can still converge if its absolute value is under 1 — e.g., r = −1/2 converges just fine, since |−1/2| = 1/2 &lt; 1.",
  fmm_wrong:`Find the sum of 5 + 15 + 45 + 135 + ... Student computes S = 5/(1−3) = −2.5.`,
  fmm_choices:["r = 3, and |3| ≥ 1, so this series diverges — it has no finite sum; the formula doesn't apply here","−2.5 is the correct sum","The student should have used S = a₁/(1+r) instead","The series converges to 2.5, the student just has a sign error"]
},
{
  id:20, unit:"U8", title:"Confusing Independent and Dependent (Conditional) Probability",
  category:"Probability",
  why:"Students multiply straight-through P(A) × P(B) for two events without checking whether the second event's probability actually changes once the first has occurred.",
  wrong:`A bag has 5 red and 3 blue marbles. Find P(red, then red) drawing WITHOUT replacement.
Student computes: P(red) × P(red) = (5/8)(5/8) = 25/64.
Treats the second draw as if the bag still has 8 marbles with 5 red, ignoring that a marble was removed.`,
  right:`Without replacement, the SECOND probability is conditional on the first draw already happening — the bag composition has changed.
P(red, then red) = P(red) × P(red | first was red).
= (5/8) × (4/7) = 20/56 = 5/14.
After removing one red marble, only 4 red remain out of 7 total.`,
  memory:'"Replacement keeps the denominator the same; no replacement shrinks it every draw." Always ask: did anything get removed and NOT put back?',
  watchout:"WITH replacement, independent events DO just multiply straight through — (5/8)×(5/8) is only wrong here specifically because the marble wasn't replaced. Read the problem carefully for that phrase.",
  fmm_wrong:`A deck has 4 aces in 52 cards. Find P(ace, then ace) drawing two cards without replacement. Student computes (4/52)×(4/52).`,
  fmm_choices:["Without replacement, the second draw only has 3 aces left in 51 cards: (4/52)×(3/51), not (4/52)×(4/52)","(4/52)×(4/52) is correct since both cards are aces","The second probability should be 4/51 since one card was removed, not 3/51","Order doesn't matter for probability, so the calculation is fine either way"]
},
{
  id:21, unit:"U8", title:"Misreading What Standard Deviation Actually Measures",
  category:"Statistics",
  why:"Students correctly calculate standard deviation numerically but describe what it means in words incorrectly, confusing it with the mean or with a simple range.",
  wrong:`Data set: {2, 4, 4, 4, 5, 5, 7, 9}. Mean = 5, SD ≈ 2.
Student describes: "The standard deviation of 2 means the average value in the data set is 2 away from zero."
Confuses SD (a measure of spread AROUND the mean) with a description of individual values or the mean itself.`,
  right:`Standard deviation measures how spread out the data is FROM THE MEAN — not from zero, and not a description of any single value.
SD ≈ 2 means: on average, data points sit about 2 units away from the mean of 5.
So most values cluster roughly between 5−2=3 and 5+2=7 — matching this data set reasonably well.`,
  memory:'"Standard deviation = typical distance FROM THE MEAN, not from zero." Always anchor the interpretation to the mean, not to the number line origin.',
  watchout:"A small SD means data is tightly clustered near the mean; a large SD means data is spread widely. Don't confuse \"small SD = small numbers\" — a data set of {998,999,1000,1001,1002} has a small SD despite large values.",
  fmm_wrong:`For a data set with mean 50 and SD 5, student says "most values are close to 5."`,
  fmm_choices:["SD describes spread AROUND the mean (50), not a value near 5 itself — most values are close to 50, typically within about 5 of it","Most values being close to 5 is a correct interpretation","SD of 5 means the mean must be recalculated","The mean and standard deviation describe the same thing here"]
},
{
  id:22, unit:"U9", title:"Mixing Up Which Denominator Is a² and Which Is b² in an Ellipse",
  category:"Conic Sections — Ellipses",
  why:"Students memorize the ellipse equation form but don't check which denominator is larger to determine whether the ellipse is wider (horizontal) or taller (vertical) — a is always tied to the LARGER denominator, not automatically the x-term.",
  wrong:`Given x²/9 + y²/25 = 1, student assumes a² is always under x² (since that's the "standard" position they memorized).
States: a = 3 (under x²), so the major axis is horizontal, along the x-axis.`,
  right:`a² is always the LARGER denominator, regardless of whether it's under x² or y² — a always corresponds to the major (longer) axis.
Here 25 &gt; 9, so a² = 25 (a = 5), and it's under y². The major axis is VERTICAL.
b² = 9 (b = 3) is the smaller denominator, under x², giving the minor axis.`,
  memory:'"Bigger denominator wins the major axis — wherever it sits." Compare the two numbers FIRST; don\'t assume position based on which variable looks first.',
  watchout:"This is different from a circle, where both denominators are equal (a = b) — if you see equal denominators, it's not an ellipse at all, it's a circle.",
  fmm_wrong:`Given x²/16 + y²/4 = 1, student says the major axis is vertical because y² "usually" indicates vertical.`,
  fmm_choices:["16 &gt; 4, so a² = 16 is under x² — the major axis is actually HORIZONTAL, not vertical","The student is correct; y² always means vertical major axis","Both axes are equal length since this is technically a circle","The major axis length can't be determined from this equation"]
},
{
  id:23, unit:"U9", title:"Sign Errors Completing the Square for a Circle's Equation",
  category:"Conic Sections — Circles",
  why:"When converting a general circle equation to standard form, students complete the square correctly on the numbers but flip the sign when reading off the center coordinates.",
  wrong:`Convert x² − 6x + y² + 4y − 12 = 0 to standard form and find the center.
Student completes the square correctly: (x−3)² + (y+2)² = 25.
Then reads the center as (3, 2) — copying the SIGNS shown inside the parentheses directly, instead of flipping them.`,
  right:`Standard form is (x−h)² + (y−k)² = r² where the CENTER is (h, k) — note the equation has MINUS signs built in.
(x−3)² means h = 3 (matches, since it's x minus 3).
(y+2)² is really (y − (−2))², so k = −2 (the sign flips because the form is y MINUS k).
Center is (3, −2), not (3, 2).`,
  memory:'"The form is x MINUS h — so a plus sign inside means the coordinate is negative." Always rewrite (y+2)² as (y−(−2))² before reading off the center.',
  watchout:"This same sign-flip trap appears in vertex form of a parabola and in ellipse/hyperbola center-finding — anywhere you see (variable + number)², rewrite it as (variable − negative number)² before reading coordinates.",
  fmm_wrong:`Given (x+4)² + (y−1)² = 9, student states the center is (4, 1).`,
  fmm_choices:["(x+4)² means x − (−4), so h = −4, not 4 — the center is (−4, 1), with the x-coordinate's sign flipped","(4, 1) is the correct center","The radius should be used as part of the center coordinates","The center can't be determined without completing the square first"]
},
{
  id:24, unit:"U10", title:"Using the Wrong Reference Angle Quadrant Rule for Sign",
  category:"Unit Circle & Trigonometric Ratios",
  why:"Students correctly compute a reference angle's numeric trig value but forget to apply the correct positive/negative sign based on which quadrant the original angle actually lands in.",
  wrong:`Find sin(210°).
Student finds the reference angle: 210° − 180° = 30°. sin(30°) = 1/2.
States: "sin(210°) = 1/2." Forgets to check the sign for the quadrant 210° is actually in.`,
  right:`210° is in Quadrant III (between 180° and 270°). In Quadrant III, sine is NEGATIVE (only tangent is positive there).
Reference angle is 30°, and sin(30°) = 1/2 gives the MAGNITUDE only.
Apply the Quadrant III sign: sin(210°) = −1/2.`,
  memory:'"All Students Take Calculus" (ASTC) — Quadrant I: All positive. II: Sine positive. III: Tangent positive. IV: Cosine positive. Everything else in that quadrant is negative.',
  watchout:"This sign step is easy to forget specifically because the reference-angle magnitude calculation feels like the \"real work\" — but the answer is incomplete and often wrong without checking the quadrant's sign rule afterward.",
  fmm_wrong:`Find cos(300°). Student finds reference angle 60°, cos(60°) = 1/2, and states cos(300°) = 1/2.`,
  fmm_choices:["300° is in Quadrant IV, where cosine IS positive — so cos(300°) = 1/2 is actually correct in this case","Cosine is always negative outside Quadrant I","The reference angle should have been 120°, not 60°","300° is in Quadrant III, so the sign should be negative"]
},
{

  wrong:`Evaluate sin(π/6) by hand, thinking of π/6 as approximately "0.524 degrees" rather than 0.524 RADIANS.

  right:`π/6 is a RADIAN measure representing 30°, since π radians = 180°.

const UNIT_NAMES = {
  U1:"Functions & Transformations", U2:"Polynomial Functions", U3:"Quadratics & Complex Numbers",
  U4:"Rational Functions", U5:"Radical Functions", U6:"Exponential & Logarithmic Functions",
  U7:"Sequences & Series", U8:"Probability & Statistics", U9:"Conic Sections", U10:"Trigonometry Intro"
};

const LS_M = 'a2ma_mastered';
let mastered = new Set(JSON.parse(localStorage.getItem(LS_M)||'[]'));
let curUnit='all', curStatus='all', curView='list', openSet=new Set();

// ── SPACED REPETITION for Find My Mistake — weight toward not-yet-mastered items ──
function weightedFMMSample(items, n){
  const p = items.map(m=>({m, w: mastered.has(m.id) ? 1 : 4}));
  const picked = [];
  for(let k=0; k<n && p.length; k++){
    const total = p.reduce((s,x)=>s+x.w, 0);
    let r = Math.random()*total, idx=0;
    for(; idx<p.length; idx++){ r -= p[idx].w; if(r<=0) break; }
    idx = Math.min(idx, p.length-1);
    picked.push(p[idx].m);
    p.splice(idx,1);
  }
  return picked;
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function saveMastered(){ localStorage.setItem(LS_M, JSON.stringify([...mastered])); }

function setUnit(u,btn){ curUnit=u; document.querySelectorAll('.pill[data-u]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function setStatus(s,btn){ curStatus=s; document.querySelectorAll('.pill[data-s]').forEach(b=>b.classList.remove('active')); btn.classList.add('active'); render(); }
function setView(v){ curView=v; document.getElementById('listBtn').classList.toggle('active', v==='list'); document.getElementById('compactBtn').classList.toggle('active', v==='compact'); document.getElementById('container').classList.toggle('compact', v==='compact'); }
function toggleOpen(id,ev){ if(ev) ev.stopPropagation(); if(openSet.has(id)) openSet.delete(id); else openSet.add(id); render(); }
function toggleMastered(id,ev){ ev.stopPropagation(); if(mastered.has(id)) mastered.delete(id); else mastered.add(id); saveMastered(); render(); }

function getFiltered(){
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  return MISTAKES.filter(m=>{
    if(curUnit!=='all' && m.unit!==curUnit) return false;
    if(curStatus==='mastered' && !mastered.has(m.id)) return false;
    if(curStatus==='unmastered' && mastered.has(m.id)) return false;
    if(q){
      const hay=(m.title+' '+m.category+' '+m.unit+' '+m.why).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function render(){
  const list = getFiltered();
  document.getElementById('s-mastered').textContent = mastered.size;
  document.getElementById('s-shown').textContent = list.length;
  const container = document.getElementById('container');
  const empty = document.getElementById('empty');
  if(list.length===0){ container.innerHTML=''; empty.style.display='block'; return; }
  empty.style.display='none';
  container.innerHTML = list.map(m=>{
    const isOpen = openSet.has(m.id);
    const isMastered = mastered.has(m.id);
    return `<div class="mistake ${isOpen?'open':''} ${isMastered?'mastered':''}">
      <div class="m-head" onclick="toggleOpen(${m.id})">
        <span class="m-num">#${String(m.id).padStart(2,'0')}</span>
        <span class="m-title">${esc(m.title)}</span>
        <div class="m-tags">
          <span class="unit-tag">${m.unit}</span>
          ${isMastered?'<span class="mastered-badge">✓ Mastered</span>':''}
        </div>
      </div>
      <div class="m-body">
        <div class="why-bar"><b>WHY IT HAPPENS</b>${esc(m.why)}</div>
        <div class="compare-grid">
          <div class="wrong-col"><span class="col-lbl">✕ WRONG APPROACH</span>${esc(m.wrong)}</div>
          <div class="right-col"><span class="col-lbl">✓ CORRECT APPROACH</span>${esc(m.right)}</div>
        </div>
        <div class="memory-bar"><b>MEMORY LOCK</b>${esc(m.memory)}</div>
        <div class="watchout-bar"><b>WATCH OUT FOR</b>${esc(m.watchout)}</div>
        <div class="m-actions">
          <button class="btn-small ${isMastered?'on':''}" onclick="toggleMastered(${m.id},event)">${isMastered?'✓ Mastered':'Mark Mastered'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── FIND MY MISTAKE ──
let fmmDeck=[], fmmIdx=0, fmmRight=0, fmmAnswered=false;
function launchFMM(){
  const pool = getFiltered().length >= 3 ? getFiltered() : MISTAKES;
  fmmDeck = weightedFMMSample(pool, Math.min(12, pool.length));
  fmmIdx=0; fmmRight=0; fmmAnswered=false;
  document.getElementById('fmm-overlay').classList.add('open');
  renderFMM();
}
function closeFMM(){ document.getElementById('fmm-overlay').classList.remove('open'); }
function renderFMM(){
  if(fmmIdx >= fmmDeck.length){
    document.getElementById('fmm-card').innerHTML = `<div style="text-align:center;padding:20px 0"><div style="font-size:11px;color:var(--muted);letter-spacing:.1em;margin-bottom:10px">SESSION COMPLETE</div><div style="font-size:32px;font-weight:800;color:var(--white)">${fmmRight}/${fmmDeck.length}</div></div>`;
    document.getElementById('fmm-next-btn').style.display='none';
    return;
  }
  const m = fmmDeck[fmmIdx];
  fmmAnswered=false;
  const shuffled = m.fmm_choices.map((c,i)=>({c,correct:i===0})).sort(()=>Math.random()-0.5);
  document.getElementById('fmm-card').innerHTML = `
    <div class="fmm-prompt-lbl">MISTAKE ${fmmIdx+1} OF ${fmmDeck.length} · ${m.unit} · ${esc(m.title)}</div>
    <div class="fmm-wrong-shown">${esc(m.fmm_wrong)}</div>
    <div class="fmm-choices">${shuffled.map((s,i)=>`<button class="fmm-opt" onclick="fmmAnswer(${i},this)">${esc(s.c)}</button>`).join('')}</div>`;
  window.__fmmShuffled = shuffled;
  document.getElementById('fmm-next-btn').style.display='none';
  document.getElementById('fmm-live-score').textContent = `${fmmRight} / ${fmmDeck.length}`;
}
function fmmAnswer(i, btn){
  if(fmmAnswered) return;
  fmmAnswered=true;
  const correct = window.__fmmShuffled[i].correct;
  const m = fmmDeck[fmmIdx];
  if(correct) fmmRight++;
  document.querySelectorAll('.fmm-opt').forEach((b,idx)=>{
    b.disabled=true;
    if(window.__fmmShuffled[idx].correct) b.classList.add('correct');
    else if(idx===i) b.classList.add('wrong');
  });
  document.getElementById('fmm-next-btn').style.display='inline-flex';
  document.getElementById('fmm-live-score').textContent = `${fmmRight} / ${fmmDeck.length}`;
}
function fmmNext(){ fmmIdx++; renderFMM(); }

document.addEventListener('DOMContentLoaded', render);
</script>
